<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf2f8"/>
      <stop offset="50%" stop-color="#f5d0fe"/>
      <stop offset="100%" stop-color="#e9d5ff"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <!-- Cute Bow Icon -->
  <g transform="translate(256,240)">
    <!-- Left Loop -->
    <path d="M-20,-10 C-90,-110 -200,-50 -180,40 C-160,110 -60,60 -20,15 Z" fill="url(#ribbon)"/>
    <!-- Right Loop -->
    <path d="M20,-10 C90,-110 200,-50 180,40 C160,110 60,60 20,15 Z" fill="url(#ribbon)"/>
    <!-- Left Tail -->
    <path d="M-25,15 C-60,70 -120,130 -140,190 C-105,170 -65,185 -45,150 C-20,100 -10,35 -20,15 Z" fill="url(#ribbon)"/>
    <!-- Right Tail -->
    <path d="M25,15 C60,70 120,130 140,190 C105,170 65,185 45,150 C20,100 10,35 20,15 Z" fill="url(#ribbon)"/>
    <!-- Center Knot -->
    <ellipse cx="0" cy="5" rx="36" ry="32" fill="#be185d"/>
    <ellipse cx="-8" cy="-2" rx="14" ry="10" fill="#fbcfe8" opacity="0.6"/>
  </g>
</svg>
